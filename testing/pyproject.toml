[project]
name = "holonlm-testing"
version = "0.0.1"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
description = "Test-only plugins for Holon (installed in the development environment, never with Holon)"
dependencies = ["holonlm", "holonlm-std", "gguf", "safetensors", "transformers"]

[project.entry-points."holon.plugins"]
"testing.ref_kernels" = "holon_testing.ref_kernels"
"testing.gguf_dense" = "holon_testing.gguf_dense"
"testing.toy_mask" = "holon_testing.toy_mask"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["holon_testing"]
