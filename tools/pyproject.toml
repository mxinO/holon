[project]
name = "holonlm-tools"
version = "0.0.1"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
description = "Holon maintainer tools: lock impact, propagation and tuning (drive engines and the judge)"
dependencies = ["holonlm", "holonlm-judge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["holon_tools"]
