[project]
name = "holonlm-plugins"
version = "0.1.1"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
description = "Holon first-party plugins: models, kernels, dialects, frontends"
dependencies = [                  # std units are reached through Ref, never imported
    "holonlm",
    "flashinfer-python==0.6.12",  # kernels.flashinfer
    "triton==3.6.0",              # the Triton kernels (torch 2.11's pin)
    "transformers",               # the models' bundles (tokenizers; pinned by holonlm-std)
    "fastapi", "uvicorn",         # frontends.http (anyio and pydantic come with fastapi)
    "xgrammar==0.2.8",            # grammar.xgrammar (Apache-2.0; needs apache-tvm-ffi >= 0.1.11)
]

[project.entry-points."holon.plugins"]
"models.qwen3" = "holon_plugins.models.qwen3"
"models.qwen3_moe" = "holon_plugins.models.qwen3_moe"
"models.qwen3_5" = "holon_plugins.models.qwen3_5"
"kernels.flashinfer" = "holon_plugins.kernels.flashinfer"
"kernels.triton_attn" = "holon_plugins.kernels.triton_attn"
"kernels.triton_experts" = "holon_plugins.kernels.triton_experts"
"kernels.triton_fp8" = "holon_plugins.kernels.triton_fp8"
"kernels.ggml_cuda" = "holon_plugins.kernels.ggml_cuda"
"kernels.expert_io" = "holon_plugins.kernels.expert_io"
"kernels.cpu_task" = "holon_plugins.kernels.cpu_task"
"kernels.ggml_cpu" = "holon_plugins.kernels.ggml_cpu"
"kernels.promote" = "holon_plugins.kernels.promote"
"kernels.fla" = "holon_plugins.kernels.fla"
"kernels.gdn_triton" = "holon_plugins.kernels.gdn_triton"
"drafters.mtp" = "holon_plugins.drafters.mtp"
"drafters.dflash" = "holon_plugins.drafters.dflash"
"drafters.ngram" = "holon_plugins.drafters.ngram"
"frontends.http" = "holon_plugins.frontends.http"
"grammar.xgrammar" = "holon_plugins.grammar.xgrammar"
"placement.lfu" = "holon_plugins.placement.lfu"
"placement.lru" = "holon_plugins.placement.lru"
"placement.profile_decay" = "holon_plugins.placement.profile_decay"
"placement.promote" = "holon_plugins.placement.promote"
"transforms.tail_skip" = "holon_plugins.transforms.tail_skip"
"tiers.pagecache" = "holon_plugins.tiers.pagecache"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["holon_plugins"]
