slot = "kernel"
license = "Apache-2.0"
core_abi = ">=1.9,<2.0"   # holon.api.HostError (docs/dev/v1-pip.md D-H)

[resources]
provides = ["kernel.qwen4_exp.ple_rows@1", "kernel.qwen4_exp.ple_block@1"]
