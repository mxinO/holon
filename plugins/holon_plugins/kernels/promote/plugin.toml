[plugin]
name = "kernels.promote"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "kernel"
license = "Apache-2.0"
core_abi = ">=1.9,<2.0"   # holon.api.HostError (docs/dev/v1-pip.md D-H)

[resources]   # placement.promote's resolve contract on CUDA (it composes the store's own moe_resolve@1)
provides = ["kernel.moe_resolve.promote@1"]
requires = ["op.moe_resolve.promote@1", "op.moe_resolve@1"]

[properties]
numerics = "exact"

[support]
platforms = ["cuda"]

[build]
module = "prebuild"
