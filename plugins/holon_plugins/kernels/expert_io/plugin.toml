[plugin]
name = "kernels.expert_io"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "kernel"
license = "Apache-2.0"
core_abi = ">=1.0,<2.0"

[resources]
provides = ["kernel.moe_resolve@1", "kernel.expert_fetch@1", "kernel.expert_prefetch@1", "kernel.moe_resolve.lfu@1",
            "kernel.moe_resolve.lru@1", "kernel.moe_patch_rows@1", "kernel.moe_tiers@1", "kernel.activation_loan@1"]
requires = ["op.moe_resolve@1", "op.expert_fetch@1", "op.expert_prefetch@1", "op.moe_resolve.lfu@1",
            "op.moe_resolve.lru@1", "op.moe_patch_rows@1", "op.moe_tiers@1", "op.activation_loan@1"]

[properties]
numerics = "exact"

[support]
platforms = ["cuda"]

[build]
module = "prebuild"

[options]
"expert_io.fetch_ctas" = { help = "CTAs per role of expert_fetch@1's one-launch gather of a group's roles", default = "8" }
"expert_io.fetch_roles" = { help = "expert_fetch@1's one-launch gather of a group's roles: on, or off (one gather per role)", default = "on" }
