[plugin]
name = "kernels.expert_io"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "kernel"
license = "Apache-2.0"
core_abi = ">=1.0,<2.0"

[resources]
provides = ["kernel.moe_resolve@1", "kernel.expert_fetch@1", "kernel.expert_prefetch@1", "kernel.moe_resolve.lfu@1",
            "kernel.moe_resolve.lru@1", "kernel.moe_patch_rows@1", "kernel.moe_tiers@1"]
requires = ["op.moe_resolve@1", "op.expert_fetch@1", "op.expert_prefetch@1", "op.moe_resolve.lfu@1",
            "op.moe_resolve.lru@1", "op.moe_patch_rows@1", "op.moe_tiers@1"]

[properties]
numerics = "exact"

[support]
platforms = ["cuda"]

[build]
module = "prebuild"
