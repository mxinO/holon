[plugin]
name = "kernels.ggml_cuda"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "kernel"
license = "Apache-2.0"

[resources]
provides = ["kernel.qlinear@2", "kernel.qembedding@1", "kernel.linear_experts@2", "kernel.moe_topk@1",
            "kernel.moe_combine@1"]
requires = ["op.qlinear@2", "op.qembedding@1", "op.linear_experts@2", "op.moe_topk@1", "op.moe_combine@1"]

[properties]
numerics = "bounded"

[support]
platforms = ["cuda"]

[provenance]
source = "https://github.com/ggml-org/llama.cpp"
commit = "cbe28bb3cb0758f0c566a9a3561766821aeb0748"
license = "MIT"
files = ["vendor/", "vendor.patch", "SHA256SUMS", "vendor.sh", "csrc/shim.cu", "csrc/api.cu",
         "plugin.py"]   # csrc and plugin.py's FP4 repack: adapted
