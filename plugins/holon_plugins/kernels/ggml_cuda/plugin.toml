[plugin]
name = "kernels.ggml_cuda"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "kernel"
license = "Apache-2.0"
core_abi = ">=1.0,<2.0"

[resources]
provides = ["kernel.qlinear@2", "kernel.qlinear_glu@1", "kernel.qembedding@1", "kernel.linear_experts@2",
            "kernel.linear_experts_arena@1",
            "kernel.moe_topk@1", "kernel.moe_router@1", "kernel.moe_combine@1"]
requires = ["op.qlinear@2", "op.qlinear_glu@1", "op.qembedding@1", "op.linear_experts@2", "op.linear_experts_arena@1",
            "op.moe_topk@1", "op.moe_router@1",
            "op.moe_combine@1"]

[properties]
numerics = "bounded"

[support]
platforms = ["cuda"]

[provenance]
source = "https://github.com/ggml-org/llama.cpp"
commit = "cbe28bb3cb0758f0c566a9a3561766821aeb0748"
license = "MIT"
files = ["vendor/", "vendor.patch", "SHA256SUMS", "vendor.sh", "csrc/shim.cu", "csrc/api.cu",
         "plugin.py"]   # csrc and plugin.py's FP4 repack: adapted

[build]
module = "prebuild"

[options]   # the EngineConfig.plugin_options keys this plugin reads
"ggml_cuda.pass_rows" = { help = "the most rows an mmq call with ids takes on a proven (SM, type) pair (docs/v1-moe-prefill.md D0), at most max_step_tokens: a lock's setting where KV capacity needs it", default = "4096", choices = ["512", "2048", "4096", "8192"] }
