[plugin]
name = "kernels.triton_attn"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "kernel"
license = "Apache-2.0"
core_abi = ">=0.2,<0.3"

[resources]
provides = ["kernel.attention.paged_prefill@1", "kernel.attention.paged_decode@1", "kernel.attention.paged_verify@1",
            "kernel.kv_write@1"]
requires = ["op.attention.paged_prefill@1", "op.attention.paged_decode@1", "op.attention.paged_verify@1",
            "op.kv_write@1"]

[properties]
numerics = "bounded"

[dependencies]
python = ["triton"]

[support]
platforms = ["cuda"]
