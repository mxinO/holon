[plugin]
name = "kernels.triton_fp8"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "kernel"
license = "Apache-2.0"
core_abi = ">=1.9,<2.0"   # holon.api.HostError (docs/dev/v1-pip.md D-H)

[resources]
provides = ["kernel.qlinear@2", "kernel.linear_rows@1"]
requires = ["op.qlinear@2", "op.linear_rows@1"]

[properties]
numerics = "bounded"

[dependencies]
python = ["triton"]

[support]
platforms = ["cuda"]
