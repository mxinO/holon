[plugin]
name = "transforms.tail_skip"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "kernel"
license = "Apache-2.0"
core_abi = ">=1.0,<2.0"

[resources]   # A1's route transform: its contract (oracle: reference.py), the CPU provider and the CUDA one (Triton)
provides = ["op.moe_route_transform.tail_skip@1", "kernel.moe_route_transform.tail_skip@1"]

[properties]
numerics = "approx"

[dependencies]
python = ["triton"]

[reference]
module = "reference"

[options]   # the EngineConfig.plugin_options keys this plugin reads
"tail_skip.rank" = { help = "a missed expert whose best routing rank in a pass is at least this is dropped (0 < rank; at the router's top_k or above nothing is)", default = "7" }
