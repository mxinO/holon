[plugin]
name = "placement.lfu"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "unit"
license = "Apache-2.0"
core_abi = ">=1.0,<2.0"

[resources]   # the policy, its resolve contract (oracle: reference.py) and the contract's CPU provider
provides = ["unit.placement.lfu@1", "op.moe_resolve.lfu@1", "kernel.moe_resolve.lfu@1"]

[properties]
numerics = "exact"

[reference]
module = "reference"

[options]   # the EngineConfig.plugin_options keys this plugin reads (kernels.expert_io's provider reads them too)
"lfu.fill_every" = { help = "FN §21.15's fill: a layer's every n-th call with decode rows fills empty slots (0: off)", default = "0" }
"lfu.fill" = { help = "the fill: the absent, unrouted experts (hottest first) a due call puts into empty slots", default = "1" }
