[plugin]
name = "placement.budget"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "unit"
license = "Apache-2.0"
core_abi = ">=1.0,<2.0"

[resources]   # the policy, its resolve contract (oracle: reference.py) and the contract's CPU provider
provides = ["unit.placement.budget@1", "op.moe_resolve.budget@1", "kernel.moe_resolve.budget@1"]

[properties]
numerics = "exact"

[reference]
module = "reference"

[options]   # the EngineConfig.plugin_options keys this plugin reads
"budget.per_layer" = { help = "the most admissions a layer's call makes per step (-1: no cap)", default = "-1" }
"budget.min_gain" = { help = "by how much a candidate's decayed count must pass its victim's to be admitted (hysteresis)", default = "0.5" }
