[plugin]
name = "drafters.ngram"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "drafter"
license = "Apache-2.0"
core_abi = ">=1.0,<2.0"

[resources]
provides = ["drafter.ngram@1"]

[options]   # the EngineConfig.plugin_options keys this plugin reads
"ngram.max" = { help = "longest suffix looked up in the request's own history", default = "3" }
"ngram.min" = { help = "shortest suffix looked up", default = "2" }
