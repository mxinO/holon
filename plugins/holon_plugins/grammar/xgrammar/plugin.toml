[plugin]
name = "grammar.xgrammar"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "logits_processor"
license = "Apache-2.0"
core_abi = ">=0.2,<0.3"

[resources]
provides = ["grammar.constraint@1"]

[properties]
numerics = "exact"

[dependencies]
python = ["xgrammar", "numpy", "torch", "triton"]   # xgrammar pinned in plugins/pyproject.toml (extra "grammar")

[options]   # the EngineConfig.plugin_options keys this plugin reads
"grammar.workers" = { help = "vetting worker processes", default = "2" }
"grammar.timeout" = { help = "seconds a constraint's vetting may take", default = "10" }
"grammar.budget" = { help = "MB a vetting worker's memory may grow by in one job before it is killed", default = "256" }
