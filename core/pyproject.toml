[project]
name = "holonlm"
version = "0.1.1"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
description = "Holon core: plugin ABI (holon.api) and runtime (holon.core)"
dependencies = ["torch==2.11.0", "numpy>=2", "msgspec>=0.19", "pyzmq>=26"]   # torch from the cu130 index (root)

[project.scripts]
holon = "holon.core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["holon"]
