[project]
name = "holonlm-core"
version = "0.2.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]   # symlinks to the root's
requires-python = ">=3.12,<3.13"
description = "Holon core: plugin ABI (holon.api) and runtime (holon.core); `python -m holon` (the `holon` command comes with holonlm)"
dependencies = ["torch==2.11.0", "numpy>=2", "msgspec>=0.19", "pyzmq>=26",   # torch from the cu130 index (root)
                "nvidia-ml-py"]   # platform.gpu_shared: whether a display or another process shares the card

[project.urls]
Repository = "https://github.com/mxinO/holon"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["holon"]
