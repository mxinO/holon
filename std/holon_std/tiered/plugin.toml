[plugin]
name = "std.tiered"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "unit"
license = "Apache-2.0"
core_abi = ">=1.2,<2.0"   # shared objects, host pools, fill pools, step hooks, extents

[resources]
provides = ["unit.std.tiered.store@1", "unit.std.tiered.pinned@1", "unit.std.tiered.gguf_direct@1",
            "unit.std.tiered.static@1"]

[properties]
numerics = "exact"

[options]   # the EngineConfig.plugin_options keys this plugin reads
"moe.ram" = { help = "the pinned RAM tier's units per class: <class>=<slots or fraction>,… (* for the rest); fewer than every piece makes RAM exclusive (a slower tier in moe.tiers holds the rest)", default = "every piece" }
