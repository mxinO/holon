[plugin]
name = "std.moe"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "unit"
license = "Apache-2.0"
core_abi = ">=1.2,<2.0"   # the offload store: shared objects, host and fill pools, extents

[resources]
provides = [
    "unit.std.moe@1",
    "unit.std.moe.resident@1",
    "unit.std.moe.offload@1",
    "op.moe_topk@1",
    "op.linear_experts@2",
    "op.moe_combine@1",
    "op.moe_resolve@1",
    "op.expert_fetch@1",
    "op.expert_prefetch@1",
    "op.linear_experts_arena@1",
]

[properties]
numerics = "exact"

[reference]
module = "reference"

[options]   # the EngineConfig.plugin_options keys this plugin reads
"quant.act" = { help = "activation precision of quantized weights' matmuls", default = "a8", choices = ["a4", "a8"] }
"moe.store" = { help = "the expert store's unit Ref: std.moe.offload@1 offloads experts to host memory", default = "std.moe.resident@1" }
"moe.placement" = { help = "the offload store's placement policy (a unit Ref): placement.lfu@1 (F11; first-party plugins), placement.lru@1, placement.profile_decay@1, std.tiered.static@1", default = "placement.lfu@1" }
"moe.placement.profile" = { help = "routing counts seeding placement: a JSON file {\"layers\": {\"<layer>\": [count per expert]}} named relative to the checkpoint's directory" }
"moe.tiers" = { help = "the offload store's host tiers (unit Refs, comma-separated)", default = "std.tiered.pinned@1" }
"moe.ring_tokens" = { help = "prompt tokens of a step from which it streams every layer's missing experts through lent ring slots, in large expert passes (0: never)", default = "512" }
"moe.route_transform" = { help = "approx: a route transform's name (its plugin's contract moe_route_transform.<name>@1); offload store only" }
"moe.cache" = { help = "VRAM cache slots per class, pinned: <class>=<slots or fraction>,… (* for the rest)", default = "fill free VRAM" }
