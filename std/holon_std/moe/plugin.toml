[plugin]
name = "std.moe"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "unit"
license = "Apache-2.0"
core_abi = ">=1.0,<2.0"

[resources]
provides = [
    "unit.std.moe@1",
    "op.moe_topk@1",
    "op.linear_experts@2",
    "op.moe_combine@1",
    "op.moe_resolve@1",
    "op.expert_fetch@1",
]

[properties]
numerics = "exact"

[reference]
module = "reference"

[options]   # the EngineConfig.plugin_options keys this plugin reads
"quant.act" = { help = "activation precision of quantized weights' matmuls", default = "a8", choices = ["a4", "a8"] }
