[plugin]
name = "std.ffn"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "unit"
license = "Apache-2.0"
core_abi = ">=1.0,<2.0"

[resources]
provides = [
    "unit.std.ffn.swiglu@1",
    "unit.std.ffn.gated_swiglu@1",
    "unit.std.ffn.sum@1",
    "op.silu_mul@1",
]

[properties]
numerics = "exact"

[reference]
module = "reference"

[options]
"ffn.fork" = { help = "on CUDA, std.ffn.sum@1's later parts (a shared expert) on a side stream beside the first (the routed experts), joined at its combine: on or off", default = "on" }
