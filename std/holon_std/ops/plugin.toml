[plugin]
name = "std.ops"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "unit"
license = "Apache-2.0"
core_abi = ">=1.0,<2.0"

[resources]
provides = [
    "unit.std.ops.rmsnorm@1",
    "unit.std.ops.rope@1",
    "unit.std.ops.linear@1",
    "unit.std.ops.embedding@1",
    "unit.std.ops.lm_head@1",
    "op.rmsnorm@1",
    "op.add_rmsnorm@1",
    "op.rope@1",
    "op.qlinear@2",
    "op.qlinear_glu@1",
    "op.linear_rows@1",
    "op.qembedding@1",
]

[properties]
numerics = "exact"

[options]   # the EngineConfig.plugin_options keys this plugin reads
"quant.act" = { help = "activation precision of quantized weights' matmuls", default = "a8", choices = ["a4", "a8"] }

[reference]
module = "reference"
