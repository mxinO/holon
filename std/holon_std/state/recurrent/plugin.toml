[plugin]
name = "std.state.recurrent"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "state_kind"
license = "Apache-2.0"
core_abi = ">=0.2,<0.3"

[resources]
provides = ["state_kind.recurrent@1"]

[properties]
numerics = "exact"

[options]   # the EngineConfig.plugin_options keys this plugin reads
"recurrent.policy" = { help = "when recurrent state is checkpointed for prefix reuse: prompt_end, or every:<n> tokens (n a multiple of the page)", default = "prompt_end" }
"recurrent.checkpoints" = { help = "recurrent-state checkpoints kept for prefix reuse", default = "max_seqs" }
