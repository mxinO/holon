[plugin]
name = "std.spec.fixed_k"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "draft_policy"
license = "Apache-2.0"
core_abi = ">=1.0,<2.0"

[resources]
provides = ["draft_policy.fixed_k@1"]

[properties]
numerics = "exact"

[options]   # the EngineConfig.plugin_options keys this plugin reads
"spec.k" = { help = "drafts per step: <k>, or <rows>:<k>,… by running requests (e.g. 1:3,3:2)", default = "3" }
"spec.fallback" = { help = "n > 0: a step decodes plainly when no running request had a real draft in its last n steps", default = "0" }
