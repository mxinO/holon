[plugin]
name = "std.mixers.qsa"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "unit"
license = "Apache-2.0"
core_abi = ">=1.5,<2.0"            # BuildCtx.unit_class

[resources]
provides = ["op.qsa_index@1", "op.qsa_select@1", "op.qsa_attend@1", "unit.std.mixers.qsa@1", "op.dsa_index@1",
            "op.mla_attend@1", "unit.std.mixers.dsa_mla@1"]

[properties]
numerics = "exact"

[reference]
module = "reference"

[provenance]   # gguf-py's tables and dequantization, vendored in std (std/holon_std/vendor/vendor.sh): the commit is this
               # unit's stamp, so a re-vendor outdates its locks (docs/dev/v1-pip.md D7)
source = "https://github.com/ggml-org/llama.cpp"
commit = "27c7a769da1671c97b2e3f6cb88704a6e1e0d0cd"
license = "MIT"
files = ["../../vendor/gguf/"]
