[plugin]
name = "std.mixers.gqa"
version = "1.0.0"
entry = "plugin:Plugin"
slot = "unit"
license = "Apache-2.0"
core_abi = ">=0.2,<0.3"

[resources]
provides = [
    "unit.std.mixers.gqa@1",
    "op.attention.paged_prefill@1",
    "op.attention.paged_decode@1",
    "op.attention.paged_verify@1",
    "op.attention.causal@1",
    "op.kv_write@1",
    "op.attention.qk_rope_kv@1",
]

[properties]
numerics = "exact"

[options]   # the EngineConfig.plugin_options keys this plugin reads
"kv.format" = { help = "KV cache format", default = "the model dtype", choices = ["q8_0", "fp8"] }

[reference]
module = "reference"
