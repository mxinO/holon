[project]
name = "holonlm-std"
version = "0.1.1"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
description = "Holon standard units: ops, blocks, ffn, mixers (each unit dir has plugin.toml + reference.py)"
dependencies = ["holonlm", "gguf>=0.17", "safetensors>=0.5", "huggingface-hub>=1.0",  # weights: hub references
                "transformers==5.6.2"]   # the GGUF tokenizer and HF tokenizers are built with it (a runtime dependency)

[project.entry-points."holon.plugins"]
"std.ops" = "holon_std.ops"
"std.blocks" = "holon_std.blocks"
"std.ffn" = "holon_std.ffn"
"std.moe" = "holon_std.moe"
"std.tiered" = "holon_std.tiered"
"std.state_tier" = "holon_std.state_tier"
"std.mixers.gqa" = "holon_std.mixers.gqa"
"std.mixers.gdn" = "holon_std.mixers.gdn"
"std.mixers.qsa" = "holon_std.mixers.qsa"
"std.hyper" = "holon_std.hyper"
"std.state.paged" = "holon_std.state.paged"
"std.state.recurrent" = "holon_std.state.recurrent"
"std.sampling" = "holon_std.sampling"
"std.weights.hf" = "holon_std.weights.hf"
"std.weights.gguf" = "holon_std.weights.gguf"
"std.spec.greedy" = "holon_std.spec.greedy"
"std.spec.rejection" = "holon_std.spec.rejection"
"std.spec.mtp_head" = "holon_std.spec.mtp_head"
"std.spec.fixed_k" = "holon_std.spec.fixed_k"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["holon_std"]
