[project]
name = "holon-workspace"
version = "0.1.1"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
description = "Holon installed from source: the runtime distributions (`uv sync --frozen`; release design D1)"
dependencies = ["holonlm", "holonlm-std", "holonlm-plugins"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true   # the root ships no code of its own: it installs the runtime distributions

[tool.uv]
default-groups = []       # a user's `uv sync` installs no test-only plugins (references never serve)
python-preference = "only-managed"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.workspace]
members = ["core", "judge", "std", "plugins", "tools", "testing"]

[tool.uv.sources]
holonlm = { workspace = true }
holonlm-judge = { workspace = true }
holonlm-std = { workspace = true }
holonlm-plugins = { workspace = true }
holonlm-tools = { workspace = true }
holonlm-testing = { workspace = true }
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true           # only torch comes from it

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "import-linter>=2.1", "httpx",  # httpx: FastAPI's TestClient
       "scipy", "jsonschema",                                     # statistical tests; bench/conformance.py
       "sentencepiece",                                           # llama.cpp's converter (test_dflash's q8_0 draft)
       "holonlm-testing", "holonlm-judge", "holonlm-tools"]       # test-only plugins, the judge, the lock tools

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spikes",  # throwaway spike code; reviewed per spike README, not linted
                  "plugins/holon_plugins/kernels/fla/vendor"]  # vendored upstream code (vendor.sh, vendor.patch)

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "judge/tests", "plugins/tests", "tools/tests"]
addopts = "-p no:libtmux"

# Design §1 invariants 2–3: import contracts (plugins added as they appear).
[tool.importlinter]
root_packages = ["holon", "holon_judge", "holon_std", "holon_plugins", "holon_tools", "holon_testing"]

[[tool.importlinter.contracts]]
name = "holon.api depends on nothing in the runtime core"
type = "forbidden"
source_modules = ["holon.api"]
forbidden_modules = ["holon.core", "holon_judge", "holon_tools"]

[[tool.importlinter.contracts]]
name = "core never imports the judge or the tools"
type = "forbidden"
source_modules = ["holon.core"]
forbidden_modules = ["holon_judge", "holon_tools"]

[[tool.importlinter.contracts]]
name = "the judge never imports the tools that drive it"
type = "forbidden"
source_modules = ["holon_judge"]
forbidden_modules = ["holon_tools"]

[[tool.importlinter.contracts]]
name = "plugins see only the ABI: std and first-party plugins never import the core runtime, judge or tools"
type = "forbidden"
source_modules = ["holon_std", "holon_plugins"]
forbidden_modules = ["holon.core", "holon_judge", "holon_tools"]

[[tool.importlinter.contracts]]
name = "models reach units only through Ref: first-party plugins never import std"
type = "forbidden"
source_modules = ["holon_plugins"]
forbidden_modules = ["holon_std"]

# Add every new std unit to the std independence list below; plugins are matched by family (`holon_plugins.<family>.*`),
# so a new plugin is covered as it lands and only a new family adds an entry.
[[tool.importlinter.contracts]]
name = "std units are injected, never imported by each other"
type = "independence"
modules = ["holon_std.ops", "holon_std.blocks", "holon_std.ffn", "holon_std.moe", "holon_std.tiered",
           "holon_std.mixers.gqa", "holon_std.mixers.gdn",
           "holon_std.state.paged", "holon_std.state.recurrent", "holon_std.state_tier",
           "holon_std.sampling", "holon_std.weights.hf", "holon_std.weights.gguf", "holon_std.spec.greedy"]

[[tool.importlinter.contracts]]
name = "first-party plugins are selected or bound by Ref, never imported by each other"
type = "independence"
modules = ["holon_plugins.drafters.*", "holon_plugins.evict.*", "holon_plugins.frontends.*",
           "holon_plugins.grammar.*", "holon_plugins.kernels.*", "holon_plugins.models.*", "holon_plugins.placement.*",
           "holon_plugins.state_tiers.*", "holon_plugins.tiers.*", "holon_plugins.transforms.*"]

[[tool.importlinter.contracts]]
name = "production code never imports the test-only plugins"
type = "forbidden"
source_modules = ["holon", "holon_std", "holon_plugins", "holon_judge", "holon_tools"]
forbidden_modules = ["holon_testing"]
