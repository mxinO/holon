[project]
name = "holon-workspace"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.12"
description = "Holon uv workspace root (not a distributable package)"

[tool.uv.workspace]
members = ["core", "judge", "std", "plugins", "tools", "testing"]

[tool.uv.sources]
holonlm = { workspace = true }
holonlm-judge = { workspace = true }
holonlm-std = { workspace = true }
holonlm-plugins = { workspace = true }
holonlm-tools = { workspace = true }
holonlm-testing = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "import-linter>=2.1", "httpx",  # httpx: FastAPI's TestClient
       "holonlm-testing"]  # test-only plugins (D1: references never serve)

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spikes"]  # throwaway spike code; reviewed per spike README, not linted

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "judge/tests", "plugins/tests", "tools/tests"]
addopts = "-p no:libtmux"

# Design §1 invariants 2–3: import contracts (plugins added as they appear).
[tool.importlinter]
root_packages = ["holon", "holon_judge", "holon_std", "holon_plugins", "holon_tools", "holon_testing"]

[[tool.importlinter.contracts]]
name = "holon.api depends on nothing in the runtime core"
type = "forbidden"
source_modules = ["holon.api"]
forbidden_modules = ["holon.core", "holon_judge", "holon_tools"]

[[tool.importlinter.contracts]]
name = "core never imports the judge or the tools"
type = "forbidden"
source_modules = ["holon.core"]
forbidden_modules = ["holon_judge", "holon_tools"]

[[tool.importlinter.contracts]]
name = "the judge never imports the tools that drive it"
type = "forbidden"
source_modules = ["holon_judge"]
forbidden_modules = ["holon_tools"]

[[tool.importlinter.contracts]]
name = "plugins see only the ABI: std and first-party plugins never import the core runtime, judge or tools"
type = "forbidden"
source_modules = ["holon_std", "holon_plugins"]
forbidden_modules = ["holon.core", "holon_judge", "holon_tools"]

[[tool.importlinter.contracts]]
name = "models reach units only through Ref: first-party plugins never import std"
type = "forbidden"
source_modules = ["holon_plugins"]
forbidden_modules = ["holon_std"]

# Add every new std unit / model package to the matching independence list below.
[[tool.importlinter.contracts]]
name = "std units are injected, never imported by each other"
type = "independence"
modules = ["holon_std.ops", "holon_std.blocks", "holon_std.ffn", "holon_std.moe", "holon_std.mixers.gqa", "holon_std.mixers.gdn",
           "holon_std.state.paged",
           "holon_std.sampling", "holon_std.weights.hf", "holon_std.weights.gguf", "holon_std.spec.greedy"]

[[tool.importlinter.contracts]]
name = "production code never imports the test-only plugins"
type = "forbidden"
source_modules = ["holon", "holon_std", "holon_plugins", "holon_judge", "holon_tools"]
forbidden_modules = ["holon_testing"]
