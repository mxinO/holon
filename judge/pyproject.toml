[project]
name = "holonlm-judge"
version = "0.0.1"
requires-python = ">=3.12"
description = "Holon judge harness: op oracles, goldens, snapshots, perf (out-of-process client)"
dependencies = ["holonlm", "gguf"]  # gguf-py: the GGUF oracle (M0.1); torch, transformers, safetensors, huggingface_hub come from the environment

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["holon_judge"]
