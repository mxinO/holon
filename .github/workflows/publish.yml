# Publish the wheels a wheels.yml run built and the GPU acceptance tested (docs/dev/v1-pip.md D11): never a rebuild.
# The dispatch names the run and the acceptance's evidence record: `sha256sum *.whl` lines (`<sha256>  <file>`), as the
# acceptance runner writes them. The job downloads that run's `wheels` artifact and uploads it only if the files are
# exactly the record's. The environment (`testpypi`, `pypi`) has the owner as its required reviewer; trusted
# publishing (OIDC), no tokens.
name: publish
on:
  workflow_dispatch:
    inputs:
      run-id:
        description: "the wheels.yml run whose artifacts the GPU acceptance tested"
        required: true
      record:
        description: "that acceptance's record in this commit: `sha256sum *.whl` lines"
        required: true
      target:
        description: "testpypi or pypi"
        type: choice
        options: [testpypi, pypi]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target }}
    permissions:
      contents: read
      actions: read                            # the tested run's artifacts
      id-token: write                          # trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with: {name: wheels, path: wheels, run-id: "${{ inputs.run-id }}", github-token: "${{ github.token }}"}
      - name: every wheel is the one the acceptance tested (its sha256 line in the record), and no other
        env:
          RECORD: ${{ inputs.record }}
        run: |
          cd wheels
          sha256sum --strict -c "$GITHUB_WORKSPACE/$RECORD"
          diff <(ls *.whl | sort) <(awk '{print $2}' "$GITHUB_WORKSPACE/$RECORD" | sort)
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086   # v1.14.3
        with:
          packages-dir: wheels
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
