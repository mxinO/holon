# Holon's wheels (docs/dev/v1-pip.md D10, D11): the pure wheels and the umbrella, one overlay of prebuilt CUDA modules
# per SM built in its image, the same modules built in the locks' image for the SASS gate, then the CPU check and the
# privacy scan. GPU acceptance runs off GitHub on the artifacts (D12). Publishing is publish.yml: it uploads a tested
# run's artifacts, never a rebuild.
name: wheels
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e    # v6.8.0
        with:
          version: "0.11.1"
      - run: uv run --no-project --python 3.12 --with packaging==26.3 python scripts/release/build_wheels.py pure --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with: {name: pure, path: dist/*.whl}
  build:                                       # an overlay, or the reference build of the same modules, per SM
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      matrix:
        kind: [overlay, reference]
        sm: [86, 89, 120]
    steps:
      - name: free disk (the image ≈ 10 GB, the environment ≈ 6 GB, the build)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - name: "build at /holon in the ${{ matrix.kind }} image (MAX_JOBS=3, as nvcc peaks at 3.4 GB a compile)"
        run: MAX_JOBS=3 scripts/release/in_image.sh ${{ matrix.kind }} HEAD out ${{ matrix.kind }} --sm ${{ matrix.sm }} --out /out
      - run: tar -C out -cf ${{ matrix.kind }}-sm${{ matrix.sm }}.tar .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with: {name: "${{ matrix.kind }}-sm${{ matrix.sm }}", path: "${{ matrix.kind }}-sm${{ matrix.sm }}.tar"}
  check:
    needs: [pure, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e    # v6.8.0
        with:
          version: "0.11.1"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with: {path: artifacts}
      - name: unpack
        run: mkdir dist && cp artifacts/pure/*.whl dist/ && for t in artifacts/*/*.tar; do tar -C dist -xf "$t"; done
      - name: the SASS gate, per SM (cuobjdump 13.0, in the locks' image)
        run: for sm in 86 89 120; do scripts/release/in_image.sh reference HEAD dist sass --sm $sm /out; done
      - name: wheels only from here on
        run: mkdir wheels && mv dist/*.whl wheels/ && ls -l wheels
      - name: the privacy scan of every member, binaries included (the full patterns run before an upload, D10.6)
        run: python3 scripts/ci/check_private.py --wheels wheels
      - name: the CPU check (contents, then a fresh venv's install)
        run: uv run --no-project --python 3.12 --with packaging==26.3 python scripts/release/build_wheels.py check wheels
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with: {name: wheels, path: wheels/*.whl}
