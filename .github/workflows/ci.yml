# CPU-only CI (release design D9 / §8): the static checks of scripts/ci/run_all.sh and the test suite without a GPU
# (GPU tests skip themselves). It runs once the repository is published; GPU checks (judge, snapshots, locks'
# isolation-check) need GPU runners and stay manual (docs/plan.md, release status).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:                                   # a newer push to the same ref cancels the run in progress
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0                       # check_abi.py and check_core_diff.sh compare with the base branch
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e    # v6.8.0
        with:
          version: "0.11.1"
      - name: environment (uv.lock, dev group)
        run: uv sync --frozen --group dev
      - name: static checks
        run: . .venv/bin/activate && bash scripts/ci/run_all.sh origin/main
      - name: tests (CPU)
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: . .venv/bin/activate && python -m pytest core std plugins judge testing tools -q -p no:cacheprovider
      - name: trim the uv cache
        if: always()
        run: uv cache prune --ci
